name: Zdjęcia zawodników — pobierz z Wikimedia
 
# Uruchamiane ręcznie z zakładki Actions. Nie wymaga żadnych sekretów —
# korzysta z publicznego API Wikidata / Wikimedia Commons.
# Pobiera wolne licencyjnie zdjęcia kadry Raków do public/photos.json.
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
# Nie pozwól, by dwa uruchomienia próbowały pushować na raz.
concurrency:
  group: refresh-photos
  cancel-in-progress: false
 
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia — potrzebna do rebase przed push
 
      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Pobierz zdjęcia z Wikimedia
        run: python scripts/fetch_photos.py
 
      - name: Zapisz photos.json (jeśli zmieniony)
        run: |
          git config user.name "rakow-scout-bot"
          git config user.email "actions@github.com"
          git add public/photos.json
          if git diff --cached --quiet; then
            echo "Brak zmian w public/photos.json."
            exit 0
          fi
          git commit -m "Zdjęcia: aktualizacja z Wikimedia [auto]"
          # Remote mógł ruszyć do przodu — ponów z rebase, aż push się uda.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; true; }
            if git push origin HEAD:main; then
              echo "Push OK (próba $i)."
              exit 0
            fi
            echo "Push odrzucony — ponawiam (próba $i)…"
            sleep 4
          done
          echo "Nie udało się wypchnąć zmian po 5 próbach." >&2
          exit 1
 
