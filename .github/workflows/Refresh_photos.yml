name: Zdjęcia zawodników — z rakow.com
 
# Uruchamiane ręcznie z zakładki Actions. Nie wymaga żadnych sekretów.
# Pobiera OFICJALNE zdjęcia kadry z własnej strony Rakowa (www.rakow.com/pl/sklad)
# do public/photos.json. Odpalaj po zmianie kadry (nowe zdjęcia na stronie klubu).
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: refresh-photos
  cancel-in-progress: false
 
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Pobierz oficjalne zdjęcia z rakow.com
        run: python scripts/fetch_rakow_photos.py
 
      - name: Zapisz photos.json (jeśli zmieniony)
        run: |
          git config user.name "rakow-scout-bot"
          git config user.email "actions@github.com"
          git add public/photos.json
          if git diff --cached --quiet; then
            echo "Brak zmian w public/photos.json."
            exit 0
          fi
          git commit -m "Zdjęcia: aktualizacja z rakow.com [auto]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; true; }
            if git push origin HEAD:main; then echo "Push OK (próba $i)."; exit 0; fi
            echo "Push odrzucony — ponawiam (próba $i)…"; sleep 4
          done
          echo "Nie udało się wypchnąć zmian po 5 próbach." >&2
          exit 1
 
