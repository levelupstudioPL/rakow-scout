name: Impect — pobierz dane

# Uruchamiane ręcznie z zakładki Actions. Wymaga sekretów repo:
#   IMPECT_USERNAME, IMPECT_PASSWORD
# (Settings → Secrets and variables → Actions → New repository secret)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb: 'discover' (lista lig) lub 'players' (dane zawodników)"
        required: true
        default: "discover"
        type: choice
        options:
          - discover
          - players
      iterations:
        description: "Dla trybu 'players': iterationId oddzielone spacją (np. 518 519)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  impect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: pip install impectPy

      - name: Uruchom Impect
        env:
          IMPECT_USERNAME: ${{ secrets.IMPECT_USERNAME }}
          IMPECT_PASSWORD: ${{ secrets.IMPECT_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "players" ]; then
            python scripts/impect.py players ${{ github.event.inputs.iterations }}
          else
            python scripts/impect.py discover
          fi

      - name: Zapisz wyniki (jeśli są)
        run: |
          if git diff --quiet -- scripts/impect_iterations.csv scripts/impect_iterations.json scripts/impect_players_*.csv 2>/dev/null; then
            echo "Brak zmian w plikach Impect."
          else
            git config user.name "rakow-scout-bot"
            git config user.email "actions@github.com"
            git add scripts/impect_iterations.csv scripts/impect_iterations.json scripts/impect_players_*.csv 2>/dev/null || true
            git commit -m "Impect: aktualizacja danych [auto]" || echo "Nic do commitu."
            git pull --rebase origin main
            git push
          fi
