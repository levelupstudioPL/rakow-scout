name: Odśwież dane ze StatsBomb
 
on:
  workflow_dispatch:
    inputs:
      tm_enrich:
        description: "Doczytać wartości z Transfermarktu dla topowych bez ceny? (wolniejsze)"
        required: false
        default: false
        type: boolean
      tm_top:
        description: "Ilu kandydatów bez ceny odpytać w TM (gdy powyżej = tak)"
        required: false
        default: "150"
 
permissions:
  contents: write
 
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4
 
      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Zainstaluj zależności
        run: pip install statsbombpy pandas openpyxl requests

      - name: Zaciągnij pierwszy skład z arkusza Google
        # Raków aktualizuje arkusz → automat filtruje „Raków Częstochowa" (pierwszy
        # skład) i nadpisuje public/squad.json. Nieudane pobranie NIE psuje składu
        # (skrypt zostawia stary plik). Arkusz musi być udostępniony „każdy z linkiem".
        env:
          SQUAD_SHEET_ID: ${{ vars.SQUAD_SHEET_ID }}
          SQUAD_SHEET_URL: ${{ vars.SQUAD_SHEET_URL }}
        run: python scripts/fetch_squad_sheet.py

      - name: Pobierz dane i wygeneruj data.json
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SCOUTASTIC_TOKEN: ${{ secrets.SCOUTASTIC_TOKEN }}
          TM_ENRICH: ${{ github.event.inputs.tm_enrich == 'true' && '1' || '' }}
          TM_ENRICH_TOP: ${{ github.event.inputs.tm_top }}
        run: python scripts/fetch_statsbomb.py
 
      - name: Zarchiwizuj wyceny (historia wartości)
        run: python scripts/archive_values.py

      - name: Zapisz zmiany
        run: |
          git add public/data.json public/value_history.json public/squad.json
          if git diff --cached --quiet; then
            echo "Brak zmian w data.json / value_history.json / squad.json."
          else
            git config user.name "rakow-scout-bot"
            git config user.email "actions@github.com"
            git commit -m "Odswiezenie danych ze StatsBomb + migawka wycen [auto]"
            git pull --rebase origin main
            git push
          fi
