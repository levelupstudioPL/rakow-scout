name: Scoutastic — sonda danych meczowych
 
# Jednorazowa diagnostyka pod walidator „Ostatnie mecze": sprawdza, czy instancja
# Scoutastic wystawia DANE MECZOWE per zawodnik (minuty/gole/asysty), których
# potrzebuje walidator. Używa istniejącego sekretu SCOUTASTIC_TOKEN.
#
# JAK UŻYĆ:
#   1. Zakładka Actions → „Scoutastic — sonda danych meczowych" → Run workflow.
#   2. Otwórz uruchomienie → krok „Sonda Scoutastic".
#   3. Skopiuj wszystkie linie zaczynające się od [sonda] i wklej Michałowi.
#
# NIC nie zapisuje ani nie commituje — tylko czyta z API i wypisuje wynik do loga.
# Nie drukuje tokenu.
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4
 
      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Sonda Scoutastic
        env:
          SCOUTASTIC_TOKEN: ${{ secrets.SCOUTASTIC_TOKEN }}
        run: python scripts/scoutastic_probe.py
 
