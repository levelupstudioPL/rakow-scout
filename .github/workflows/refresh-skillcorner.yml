name: SkillCorner — pobierz dane
 
# Uruchamiane ręcznie z zakładki Actions. Wymaga sekretów repo:
#   SKILLCORNER_USERNAME, SKILLCORNER_PASSWORD
# (klucz API SkillCorner wpisz zwykle jako SKILLCORNER_PASSWORD)
 
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb: discover | physical-all | physical | gi-all | gi | runtypes-all | runtypes"
        required: true
        default: "discover"
        type: choice
        options:
          - discover
          - physical-all
          - physical
          - gi-all
          - gi
          - runtypes-all
          - runtypes
      edition:
        description: "Dla trybu 'physical'/'gi': competition_edition id (można kilka, spacja)"
        required: false
        default: ""
 
permissions:
  contents: write
 
jobs:
  skillcorner:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v4
 
      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Zainstaluj zależności
        run: pip install skillcorner pandas
 
      - name: Uruchom SkillCorner
        env:
          SKILLCORNER_USERNAME: ${{ secrets.SKILLCORNER_USERNAME }}
          SKILLCORNER_PASSWORD: ${{ secrets.SKILLCORNER_PASSWORD }}
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ "$M" = "physical-all" ]; then
            python scripts/fetch_skillcorner.py physical-all
          elif [ "$M" = "physical" ]; then
            python scripts/fetch_skillcorner.py physical ${{ github.event.inputs.edition }}
          elif [ "$M" = "gi-all" ]; then
            python scripts/fetch_skillcorner.py gi-all
          elif [ "$M" = "gi" ]; then
            python scripts/fetch_skillcorner.py gi ${{ github.event.inputs.edition }}
          elif [ "$M" = "runtypes-all" ]; then
            python scripts/fetch_skillcorner.py runtypes-all
          elif [ "$M" = "runtypes" ]; then
            python scripts/fetch_skillcorner.py runtypes ${{ github.event.inputs.edition }}
          else
            python scripts/fetch_skillcorner.py discover
          fi
 
      - name: Zapisz wyniki (jeśli są)
        run: |
          git add scripts/skillcorner_*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Brak zmian w plikach SkillCorner."
          else
            git config user.name "rakow-scout-bot"
            git config user.email "actions@github.com"
            git commit -m "SkillCorner: aktualizacja danych [auto]"
            git pull --rebase origin main
            git push
          fi
 
